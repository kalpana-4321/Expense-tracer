<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 80" width="360" height="80">
  <defs>
    <linearGradient id="ldBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e1726" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>
    <linearGradient id="ldCyan" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#7dd3fc" />
    </linearGradient>
    <linearGradient id="ldStem" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
    <linearGradient id="ldStar" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
  </defs>

  <!-- Icon Mark (left side: 64x64, positioned at x=8, y=8) -->
  <g transform="translate(8, 8)">
    <rect width="64" height="64" rx="16" fill="url(#ldBg)" />
    <rect width="63" height="63" x="0.5" y="0.5" rx="15.5" fill="none" stroke="#1e293b" stroke-width="0.8" stroke-opacity="0.8" />

    <g transform="translate(0.5, 0)">
      <rect x="15" y="17.5" width="7.5" height="29" rx="2.5" fill="url(#ldStem)" opacity="0.9" />
      <path
        d="M 22.5 18 C 22.5 17 23.5 16.5 24.5 16.8 C 25.5 17 26 17.5 26.5 18.2 L 39 43.5 C 39.5 44.5 40.5 45 41.5 45 C 42.5 45 43.5 46 43.5 47 C 43.5 48 42.5 48.5 41.5 48.5 C 40 48.5 39 47.5 38.5 46.5 L 23.5 20.5 C 22.5 19.5 22.5 18.5 22.5 18 Z"
        fill="url(#ldCyan)"
      />
      <rect x="40.5" y="23.5" width="7.5" height="23" rx="2.5" fill="url(#ldStem)" />
      <g transform="translate(44.25, 16.5)">
        <circle cx="0" cy="0" r="3.5" fill="#38bdf8" opacity="0.25" />
        <path
          d="M 0 -4.8 Q 0 0 4.8 0 Q 0 0 0 4.8 Q 0 0 -4.8 0 Q 0 0 0 -4.8 Z"
          fill="url(#ldStar)"
        />
        <circle cx="0" cy="0" r="0.8" fill="#ffffff" />
      </g>
    </g>
  </g>

  <!-- Typography: NOVA FINANCE -->
  <g transform="translate(88, 0)">
    <!-- "NOVA" Title -->
    <text
      x="0"
      y="42"
      font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
      font-size="28"
      font-weight="800"
      letter-spacing="0.08em"
      fill="#ffffff"
    >
      NOVA
    </text>

    <!-- Glowing Accent dot -->
    <circle cx="106" cy="38" r="3" fill="#38bdf8" />

    <!-- "FINANCE" Subtitle with wide modern tracking -->
    <text
      x="0"
      y="59"
      font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
      font-size="11"
      font-weight="600"
      letter-spacing="0.26em"
      fill="#94a3b8"
    >
      FINANCE
    </text>
  </g>
</svg>
