<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="lmBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e1726" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>
    <linearGradient id="lmCyan" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#7dd3fc" />
    </linearGradient>
    <linearGradient id="lmStem" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
    <linearGradient id="lmStar" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
  </defs>

  <!-- Rounded Squircle -->
  <rect width="128" height="128" rx="30" fill="url(#lmBg)" />
  <rect width="126" height="126" x="1" y="1" rx="29" fill="none" stroke="#1e293b" stroke-width="1" stroke-opacity="0.8" />

  <g transform="translate(1.5, 0)">
    <!-- Left Stem -->
    <rect x="30" y="35" width="15" height="58" rx="5" fill="url(#lmStem)" opacity="0.9" />

    <!-- Diagonal Slash -->
    <path
      d="M 45 36 C 45 34 47 33 49 33.5 C 51 34 52 35 53 36.5 L 78 87 C 79 89 81 90 83 90 C 85 90 87 92 87 94 C 87 96 85 97 83 97 C 80 97 78 95 77 93 L 47 41 C 45 39 45 37 45 36 Z"
      fill="url(#lmCyan)"
    />

    <!-- Right Stem -->
    <rect x="81" y="47" width="15" height="46" rx="5" fill="url(#lmStem)" />

    <!-- Nova Star -->
    <g transform="translate(88.5, 33)">
      <circle cx="0" cy="0" r="7" fill="#38bdf8" opacity="0.25" />
      <path
        d="M 0 -9.5 Q 0 0 9.5 0 Q 0 0 0 9.5 Q 0 0 -9.5 0 Q 0 0 0 -9.5 Z"
        fill="url(#lmStar)"
      />
      <circle cx="0" cy="0" r="1.5" fill="#ffffff" />
    </g>
  </g>
</svg>
